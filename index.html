<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>StarCoins</title>
<script src="https://telegram.org"></script>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
input{-webkit-user-select:text;user-select:text}
html,body{margin:0;padding:0;width:100%;height:100dvh;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 0%,#2e1065 0%,#0f172a 48%,#030712 100%)}
.top{padding:10px 12px 6px;text-align:center;position:relative;flex-shrink:0}
.rst{position:absolute;right:10px;top:12px;background:rgba(239,68,68,.2);border:1px solid rgba(239,68,68,.5);color:#fca5a5;border-radius:9px;padding:5px 8px;font-size:11px}
.box{display:inline-flex;align-items:center;gap:6px;background:rgba(15,23,42,.8);border:1px solid rgba(251,191,36,.45);padding:6px 16px;border-radius:99px;box-shadow:0 0 20px rgba(251,191,36,.25)}
.bal{font-size:22px;font-weight:900;color:#fbbf24}
.sub{font-size:11px;color:#cbd5e1;margin-top:5px}
.scr{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 10px 105px;display:none}
.scr.act{display:flex;flex-direction:column}
#s-tap{align-items:center;justify-content:center;position:relative;overflow:hidden;padding-bottom:85px}
.glow{position:absolute;width:210px;height:210px;border-radius:50%;pointer-events:none;transition:background .3s}
.star{width:170px;height:170px;transition:transform .35s cubic-bezier(.22,1,.36,1);touch-action:manipulation}
.star.tap{transform:scale(.9)}
.star.spin{animation:spin .45s ease}
@keyframes spin{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
.colors{display:flex;gap:8px;margin-top:16px;z-index:5}
.c-btn{background:rgba(30,41,59,.85);border:1px solid rgba(148,163,184,.3);color:#fff;padding:7px 10px;border-radius:12px;font-size:11px;font-weight:700;text-align:center}
.c-btn.act{border-color:#fbbf24;background:rgba(251,191,36,.2);color:#fde047}
.flt{position:absolute;font-size:22px;font-weight:900;color:#fde047;pointer-events:none;animation:up .65s ease-out forwards}
@keyframes up{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-80px) scale(1.15)}}
.it{background:rgba(30,41,59,.88);border:1px solid rgba(148,163,184,.22);border-radius:12px;padding:9px 10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-shrink:0}
.it-txt{min-width:0;flex:1}
.it-txt b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it-txt small{font-size:11px;color:#94a3b8}
.lf{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.btn{background:#2563eb;color:#fff;border:none;padding:8px 10px;border-radius:9px;font-weight:700;font-size:11px;white-space:nowrap;flex-shrink:0}
.gld{background:linear-gradient(45deg,#f59e0b,#fbbf24);color:#000}
.row-in{display:flex;gap:6px;margin-bottom:10px;flex-shrink:0}
.inp{flex:1;min-width:0;background:#0f172a;border:1px solid #334155;color:#fff;padding:8px 10px;border-radius:9px;font-size:13px}
.rk{width:24px;height:24px;border-radius:7px;background:#334155;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;flex-shrink:0}
.rk1{background:#fbbf24;color:#000}.rk2{background:#cbd5e1;color:#000}.rk3{background:#ea580c;color:#fff}
.nav{position:fixed;left:8px;right:8px;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;background:rgba(15,23,42,.97);border:1px solid rgba(251,191,36,.45);border-radius:16px;padding:8px 2px;z-index:99;box-shadow:0 8px 25px rgba(0,0,0,.7)}
.tab{flex:1;text-align:center;font-size:10px;color:#94a3b8;padding:3px 1px}
.tab.act{color:#fbbf24;font-weight:700}
</style>
</head>
<body>
<div class="top">
    <button class="rst" onclick="rst()">🗑️ Сброс</button>
    <div class="box"><span id="st-ico" style="font-size:20px">🟡</span><span class="bal" id="bal">0</span></div>
    <div class="sub">Множ: <b>x<span id="mul">1</span></b> | Клик: +<span id="pwr">1</span> | Доход: +<span id="inc">0</span>/с | ⏱ <span id="hrs">0.0</span>ч</div>
</div>

<div id="s-tap" class="scr act">
    <div class="glow" id="glow"></div>
    <svg class="star" id="star" viewBox="0 0 100 100">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop id="c1" offset="0%" stop-color="#fef08a"/><stop id="c2" offset="50%" stop-color="#f59e0b"/><stop id="c3" offset="100%" stop-color="#b45309"/></linearGradient></defs>
        <path id="st-path" fill="url(#g)" d="M50 6 L63 34 L94 38 L71 59 L77 90 L50 75 L23 90 L29 59 L6 38 L37 34 Z" stroke="#fde047" stroke-width="2" stroke-linejoin="round"/>
    </svg>
    <div class="colors" id="colors"></div>
</div>

<div id="s-upg" class="scr"></div>
<div id="s-nft" class="scr"></div>
<div id="s-top" class="scr">
    <div class="row-in">
        <input id="nick-in" class="inp" placeholder="Ваш @username...">
        <button class="btn gld" onclick="saveNick()">Сохранить</button>
    </div>
    <div id="lb-list"></div>
</div>
<div id="s-don" class="scr">
    <div class="row-in">
        <input id="promo-in" class="inp" placeholder="Введите промокод...">
        <button class="btn gld" onclick="usePromo()">Активировать</button>
    </div>
    <div id="don-list"></div>
</div>

<div class="nav">
    <div class="tab act" onclick="go('tap',this)">⭐ Тап</div>
    <div class="tab" onclick="go('upg',this)">⚡ Бусты</div>
    <div class="tab" onclick="go('nft',this)">🎁 Подарки</div>
    <div class="tab" onclick="go('top',this)">🏆 Топ</div>
    <div class="tab" onclick="go('don',this)">💎 Донат</div>
</div>

<script>
const DB_URL = "https://starcoins-d91b8-default-rtdb.firebaseio.com"; // Вставьте ссылку из Firebase
const ADMIN_USER = "Dmitry Ivliev"; // Ваш юзернейм без @ (куда писать за покупкой кода)
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const uid = tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : ('u_' + (localStorage.getItem('gid') || (() => {
    const id = Math.floor(Math.random() * 1e9); localStorage.setItem('gid', id); return id;
})()));

let s = { b: 0, p: 1, i: 0, sec: 0, lv: 0, paint: 0, nick: '', used: [] };
const KEYS = ['sc_v27', 'sc_v24', 'sc_v22', 'sc_v20', 'sc_ios', 'sc_v11', 'sc_v10', 'sc_v8'];
for (const k of KEYS) {
    try {
        const raw = localStorage.getItem(k);
        if (raw) {
            const old = JSON.parse(raw);
            if (old && (old.b > 0 || old.p > 1 || old.i > 0 || old.lv > 0)) {
                s = Object.assign(s, old);
                if (s.paint === undefined) s.paint = s.lv;
                if (!Array.isArray(s.used)) s.used = [];
                break;
            }
        }
    } catch(e) {}
}

if (!s.nick) {
    const u = tg?.initDataUnsafe?.user;
    s.nick = u?.username ? '@' + u.username : (u?.first_name || 'Игрок #' + uid.slice(-4));
}

// Секретные промокоды (можете менять названия и суммы здесь)
const PROMOS = {
    'START2026': 10000000,       // Бесплатный стартовый код на 10 М
    'STAR100M': 100000000,       // Код на 100 М
    'MEGA1B': 1000000000,        // Код на 1 МЛРД
    'KING100B': 100000000000     // Код на 100 МЛРД
};

const STARS = [
    { ico: '🟡', mul: 1, cost: 0, c1: '#fef08a', c2: '#f59e0b', c3: '#b45309', str: '#fde047', gl: 'rgba(251,191,36,.32)' },
    { ico: '🔵', mul: 2, cost: 100000000000, c1: '#bae6fd', c2: '#0284c7', c3: '#1e3a8a', str: '#38bdf8', gl: 'rgba(56,189,248,.35)' },
    { ico: '🟢', mul: 3, cost: 5000000000000, c1: '#bbf7d0', c2: '#16a34a', c3: '#14532d', str: '#4ade80', gl: 'rgba(74,222,128,.35)' },
    { ico: '🟣', mul: 5, cost: 100000000000000, c1: '#f3e8ff', c2: '#9333ea', c3: '#3b0764', str: '#c084fc', gl: 'rgba(192,132,252,.42)' }
];

const UPGS = [
    ['👆 Мощный клик', 1, 100], ['🧲 Магнит звёзд', 10, 1000], ['🔥 Турбо-тап', 250, 25000],
    ['🚀 Звёздный реактор', 15000, 1500000], ['🌌 Галактический луч', 600000, 75000000],
    ['🌠 Сверхновая', 8000000, 800000000], ['👑 Властелин Вселенной', 60000000, 5000000000],
    ['⚛️ Квантовый коллайдер', 8000000000, 500000000000], ['🕳️ Чёрная дыра', 200000000000, 10000000000000]
];
const NFTS = [
    ['🧸 Плюшевый мишка', 5, 500], ['❤️ Красное сердце', 35, 3500], ['🎂 Праздничный торт', 200, 20000],
    ['🚀 Космо-ракета', 1500, 150000], ['💎 Кибер-алмаз NFT', 45000, 4000000],
    ['🏆 Золотой Кубок NFT', 1200000, 120000000], ['👑 Трон Галактики NFT', 55000000, 5000000000],
    ['🛸 Флот Галактики NFT', 7500000000, 500000000000], ['🌌 Сердце Вселенной NFT', 180000000000, 10000000000000]
];
const DON_PACKS = [
    ['🎁 Бесплатный бонус', 'Промокод: START2026', '10 М ⭐'],
    ['💎 Пакет 100 МЛН', 'Написать админу за кодом', '5 ⭐️'],
    ['🚀 Пакет 1 МЛРД', 'Написать админу за кодом', '25 ⭐️'],
    ['👑 Пакет 100 МЛРД', 'Написать админу за кодом', '50 ⭐️']
];

function fmt(n) {
    if (n >= 1e12) return (n / 1e12).toFixed(1) + ' ТРЛН';
    if (n >= 1e9) return (n / 1e9).toFixed(1) + ' МЛРД';
    if (n >= 1e6) return (n / 1e6).toFixed(1) + ' М';
    return Math.floor(n).toLocaleString();
}

document.getElementById('s-upg').innerHTML = UPGS.map(u => `
    <div class="it"><div class="it-txt"><b>${u[0]}</b><small>+${fmt(u[1])} за клик</small></div><button class="btn" onclick="buy(${u[2]},${u[1]},0)">${fmt(u[2])} ⭐</button></div>
`).join('');

document.getElementById('s-nft').innerHTML = NFTS.map(n => `
    <div class="it"><div class="it-txt"><b>${n[0]}</b><small>+${fmt(n[1])} / сек</small></div><button class="btn gld" onclick="buy(${n[2]},0,${n[1]})">${fmt(n[2])} ⭐</button></div>
`).join('');

document.getElementById('don-list').innerHTML = DON_PACKS.map((d, i) => `
    <div class="it" style="${i===3?'border-color:#fbbf24':''}">
        <div class="it-txt"><b>${d[0]}</b><small>${d[1]}</small></div>
        <button class="btn gld" onclick="${i===0?"document.getElementById('promo-in').value='START2026';usePromo()":"contactAdmin()"}">${d[2]}</button>
    </div>
`).join('');

function contactAdmin() {
    const url = `https://t.me{ADMIN_USER}`;
    if (tg?.openTelegramLink) tg.openTelegramLink(url);
    else window.open(url, '_blank');
}

function usePromo() {
    const inp = document.getElementById('promo-in');
    const code = inp.value.trim().toUpperCase();
    if (!code) return;
    if (s.used.includes(code)) {
        return tg?.showAlert ? tg.showAlert('Этот код уже активирован!') : alert('Этот код уже активирован!');
    }
    if (!PROMOS[code]) {
        return tg?.showAlert ? tg.showAlert('Неверный промокод!') : alert('Неверный промокод!');
    }
    const add = PROMOS[code];
    s.b += add;
    s.used.push(code);
    inp.value = '';
    render(); sync();
    if (tg?.showAlert) tg.showAlert(`Успешно! Начислено +${fmt(add)} StarCoins!`);
    else alert(`Успешно! Начислено +${fmt(add)} StarCoins!`);
}

function pickStar(idx) {
    const stEl = document.getElementById('star');
    if (idx <= s.lv) {
        s.paint = idx;
        stEl.classList.remove('spin'); void stEl.offsetWidth; stEl.classList.add('spin');
        if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
        render(); return;
    }
    if (idx !== s.lv + 1) {
        return tg?.showAlert ? tg.showAlert('Сначала откройте предыдущую звезду!') : alert('Сначала откройте предыдущую звезду!');
    }
    const nxt = STARS[idx];
    if (s.b < nxt.cost) {
        return tg?.showAlert ? tg.showAlert(`Нужно ${fmt(nxt.cost)} StarCoins!`) : alert(`Нужно ${fmt(nxt.cost)} StarCoins!`);
    }
    const doUpgrade = () => {
        s.lv = idx; s.paint = idx; s.b = 0; s.p = 1; s.i = 0;
        stEl.classList.remove('spin'); void stEl.offsetWidth; stEl.classList.add('spin');
        render(); sync();
    };
    if (tg?.showConfirm) tg.showConfirm(`Открыть звезду x${nxt.mul}? Монеты, бусты и подарки обнулятся!`, r => { if (r) doUpgrade(); });
    else if (confirm(`Открыть звезду x${nxt.mul}? Монеты, бусты и подарки обнулятся!`)) doUpgrade();
}

function render() {
    const cur = STARS[s.lv] || STARS[0];
    const vis = STARS[s.paint !== undefined ? s.paint : s.lv] || cur;
    document.getElementById('st-ico').textContent = cur.ico;
    document.getElementById('bal').textContent = fmt(s.b);
    document.getElementById('mul').textContent = cur.mul;
    document.getElementById('pwr').textContent = fmt(s.p * cur.mul);
    document.getElementById('inc').textContent = fmt(s.i * cur.mul);
    document.getElementById('hrs').textContent = (s.sec / 3600).toFixed(1);

    document.getElementById('c1').setAttribute('stop-color', vis.c1);
    document.getElementById('c2').setAttribute('stop-color', vis.c2);
    document.getElementById('c3').setAttribute('stop-color', vis.c3);
    document.getElementById('st-path').setAttribute('stroke', vis.str);
    document.getElementById('glow').style.background = `radial-gradient(circle,${vis.gl} 0%,transparent 70%)`;

    document.getElementById('colors').innerHTML = STARS.map((st, i) => {
        const sub = i <= s.lv ? `x${st.mul}` : fmt(st.cost);
        return `<button class="c-btn ${s.paint === i ? 'act' : ''}" onclick="pickStar(${i})">${st.ico}<br>${sub}</button>`;
    }).join('');

    try { localStorage.setItem('sc_v27', JSON.stringify(s)); } catch(e) {}
}

async function sync() {
    if (!DB_URL.startsWith('http')) return;
    const cur = STARS[s.lv] || STARS[0];
    try {
        await fetch(`${DB_URL}/players/${uid}.json`, {
            method: 'PUT',
            body: JSON.stringify({ name: `${cur.ico} ${s.nick}`, b: Math.floor(s.b), h: +(s.sec / 3600).toFixed(1) })
        });
    } catch(e) {}
}

function saveNick() {
    const v = document.getElementById('nick-in').value.trim();
    if (!v) return;
    s.nick = v.startsWith('@') ? v : '@' + v;
    render(); sync().then(drawTop);
}

async function drawTop() {
    document.getElementById('nick-in').value = s.nick;
    const box = document.getElementById('lb-list');
    if (!DB_URL.startsWith('http')) { box.innerHTML = '<div style="text-align:center;color:#fca5a5;padding:15px">Укажите DB_URL</div>'; return; }
    box.innerHTML = '<div style="text-align:center;color:#94a3b8;padding:15px">Загрузка...</div>';
    await sync();
        try {
        const res = await fetch(`${DB_URL}/players.json`);
        const data = await res.json();
        if (!data) { box.innerHTML = '<div style="text-align:center;color:#94a3b8">Пока нет игроков</div>'; return; }
        const list = Object.entries(data).map(([id, u]) => ({ id, ...u })).sort((a, b) => (b.b || 0) - (a.b || 0));
        box.innerHTML = list.map((u, idx) => `
            <div class="it" style="${u.id === uid ? 'border-color:#fbbf24' : ''}">
                <div class="lf"><div class="rk rk${idx + 1}">${idx + 1}</div><div class="it-txt"><b>${u.name}</b><small>⏱ ${u.h || 0} ч</small></div></div>
                <b style="font-size:12px">${fmt(u.b || 0)} ⭐</b>
            </div>
        `).join('');
    } catch(e) { box.innerHTML = '<div style="text-align:center;color:#fca5a5">Проверьте Firebase (test mode)</div>'; }
}

document.getElementById('star').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const stEl = document.getElementById('star');
    stEl.classList.add('tap'); setTimeout(() => stEl.classList.remove('tap'), 70);
    const gain = s.p * (STARS[s.lv]?.mul || 1);
    s.b += gain; render();
    if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    const el = document.createElement('div');
    el.className = 'flt'; el.textContent = '+' + fmt(gain);
    el.style.left = (e.clientX - 15) + 'px'; el.style.top = (e.clientY - 60) + 'px';
    document.getElementById('s-tap').appendChild(el);
    setTimeout(() => el.remove(), 650);
});

function buy(c, p, i) {
    if (s.b < c) return tg?.showAlert ? tg.showAlert('Не хватает StarCoins!') : alert('Не хватает StarCoins!');
    s.b -= c; s.p += p; s.i += i; render(); sync();
}
function rst() {
    const ok = () => { s = { b: 0, p: 1, i: 0, sec: 0, lv: 0, paint: 0, nick: s.nick, used: s.used }; render(); sync().then(drawTop); };
    if (tg?.showConfirm) tg.showConfirm('Сбросить прогресс?', r => { if (r) ok(); });
    else if (confirm('Сбросить прогресс?')) ok();
}
function go(id, el) {
    document.querySelectorAll('.scr').forEach(x => x.classList.remove('act'));
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('act'));
    document.getElementById('s-' + id).classList.add('act'); el.classList.add('act');
    if (id === 'top') drawTop();
}

setInterval(() => { s.sec += 1; if (s.i > 0) s.b += s.i * (STARS[s.lv]?.mul || 1); render(); }, 1000);
setInterval(sync, 10000);
render();
sync();
</script>
</body>
</html>
